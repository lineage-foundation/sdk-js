name: Publish to npm

# Publishes @lineage-foundation/sdk-js to npm when a GitHub Release is published.
# Uses npm Trusted Publishing (OIDC) — no NODE_AUTH_TOKEN is stored in the repo —
# and attaches build provenance. See docs/PUBLISHING.md for the one-time npm setup.

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write  # required for OIDC Trusted Publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use an npm that supports Trusted Publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public
